<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- E-Reader Body -->
  <g filter="url(#shadow)">
    <rect x="100" y="70" width="312" height="372" rx="28" fill="#334155" stroke="#475569" stroke-width="4" />
  </g>

  <!-- E-Paper Screen (square 200x200 representation) -->
  <rect x="136" y="106" width="240" height="240" rx="12" fill="url(#screenGrad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- E-Paper Content / Text lines -->
  <rect x="160" y="136" width="120" height="12" rx="6" fill="#0f172a" opacity="0.85" />
  <rect x="160" y="162" width="192" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="180" width="180" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="198" width="192" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="216" width="150" height="8" rx="4" fill="#334155" opacity="0.7" />

  <rect x="160" y="244" width="192" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="262" width="170" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="280" width="192" height="8" rx="4" fill="#334155" opacity="0.7" />
  <rect x="160" y="298" width="120" height="8" rx="4" fill="#334155" opacity="0.7" />

  <!-- Page number footer on e-paper screen -->
  <rect x="236" y="324" width="40" height="6" rx="3" fill="#64748b" opacity="0.6" />

  <!-- Bottom bezel button / navigation dot -->
  <circle cx="256" cy="390" r="14" fill="#1e293b" stroke="#64748b" stroke-width="3" />

  <!-- Bluetooth Sync Badge overlay in bottom right -->
  <circle cx="390" cy="390" r="62" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="6" />
  <!-- Bluetooth Rune -->
  <path d="M 390 354 L 390 426 M 390 354 L 408 372 L 378 396 L 408 420 L 390 426 M 378 376 L 390 390 L 378 404" 
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>